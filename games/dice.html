<!DOCTYPE html>
<html>

<head>
    <title>Dice Roll</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <h1>🎲 DICE ROLL</h1>

    <h2 id="coins">Your Coins: 100</h2>

    <input type="number" id="bet" placeholder="Enter your bet">

    <br><br>

    <input type="number" id="guess" min="1" max="6" placeholder="Guess (1-6)">

    <br><br>

    <button id="roll">ROLL DICE</button>

    <br><br>

    <h1 id="dice">🎲</h1>

    <h2 id="message"></h2>

    <script src="dice.js"></script>

</body>

</html>
